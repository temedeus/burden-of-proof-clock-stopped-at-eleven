# Profile: full — editor Vite app + file-writing backend (no AI)
services:
  editor-app:
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile.frontend
    working_dir: /app
    command: pnpm dev:editor --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - editor_node_modules:/app/node_modules
    depends_on:
      - editor-backend

  editor-backend:
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile.backend
    working_dir: /app
    command: pnpm dev:editor:backend
    environment:
      EDITOR_BACKEND_PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - editor_node_modules:/app/node_modules

volumes:
  editor_node_modules:
