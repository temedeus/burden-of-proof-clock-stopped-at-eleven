<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Blackwood Manor" />
  <title>Murder at Blackwood Manor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./src/styles/game-shell.css" />
</head>
<body>
  <div id="game-shell">
    <div id="game-stage">
      <canvas id="game" width="800" height="600"></canvas>
      <div id="touch-controls" hidden>
        <div class="touch-dpad" aria-label="Movement controls">
          <span class="touch-btn empty"></span>
          <button type="button" class="touch-btn" data-key="arrowup" aria-label="Up">↑</button>
          <span class="touch-btn empty"></span>
          <button type="button" class="touch-btn" data-key="arrowleft" aria-label="Left">←</button>
          <span class="touch-btn empty"></span>
          <button type="button" class="touch-btn" data-key="arrowright" aria-label="Right">→</button>
          <span class="touch-btn empty"></span>
          <button type="button" class="touch-btn" data-key="arrowdown" aria-label="Down">↓</button>
          <span class="touch-btn empty"></span>
        </div>
        <div class="touch-actions" aria-label="Action controls">
          <button type="button" class="touch-btn wide" data-key="e" data-tap="true" aria-label="Interact">E</button>
          <button type="button" class="touch-btn wide" data-key="i" data-tap="true" aria-label="Inventory">I</button>
          <button type="button" class="touch-btn wide" data-key="escape" data-tap="true" aria-label="Menu">☰</button>
        </div>
      </div>
    </div>
  </div>
  <div id="rotate-hint">
    <p>Rotate your device to landscape for the best experience.</p>
    <button type="button" id="rotate-hint-dismiss">Continue anyway</button>
  </div>
  <script type="module" src="./src/index.ts"></script>
</body>
</html>
