<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="von Virtanen Manor" />
  <title>Murder at von Virtanen Manor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital,wght@0,400;1,400&family=IM+Fell+English+SC&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./src/styles/game-shell.css" />
</head>
<body>
  <div id="game-shell">
    <div id="game-stage">
      <canvas id="game" width="800" height="600"></canvas>
      <div id="touch-controls" hidden>
        <div class="touch-dpad" aria-label="Movement controls — drag across sectors">
          <span class="touch-arrow diagonal" data-sector="5" aria-hidden="true"></span>
          <span class="touch-arrow" data-sector="6" aria-hidden="true"></span>
          <span class="touch-arrow diagonal" data-sector="7" aria-hidden="true"></span>
          <span class="touch-arrow" data-sector="4" aria-hidden="true"></span>
          <span class="touch-arrow" data-sector="0" aria-hidden="true"></span>
          <span class="touch-arrow diagonal" data-sector="3" aria-hidden="true"></span>
          <span class="touch-arrow" data-sector="2" aria-hidden="true"></span>
          <span class="touch-arrow diagonal" data-sector="1" aria-hidden="true"></span>
          <span class="touch-dpad-knob" aria-hidden="true"></span>
        </div>
        <div class="touch-actions" aria-label="Action controls">
          <button type="button" class="touch-btn primary" data-key="e" aria-label="Interact">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5L21 21" /></svg>
            <span>Interact</span>
          </button>
          <button type="button" class="touch-btn" data-key="m" aria-label="Map">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5zM9 4v13.5M15 6.5V20" /></svg>
            <span>Map</span>
          </button>
          <button type="button" class="touch-btn" data-key="i" aria-label="Inventory">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5h14a1 1 0 0 1 1 1V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9.5a1 1 0 0 1 1-1zM9 8.5V7a3 3 0 0 1 6 0v1.5M4 13h16M12 12v2.5" /></svg>
            <span>Items</span>
          </button>
          <button type="button" class="touch-btn" data-key="escape" aria-label="Menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
            <span>Menu</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div id="rotate-hint">
    <p>Rotate your device to landscape for the best experience.</p>
    <button type="button" id="rotate-hint-dismiss">Continue anyway</button>
  </div>
  <script type="module" src="./src/index.ts"></script>
</body>
</html>
